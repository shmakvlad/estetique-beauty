# Настройка выкладки на Netlify.
# Сборка идёт из data/*.json и src/ — папка dist в репозитории не хранится.

[build]
  command = "npm run build:prod"   # чистые адреса вида /uslugi/chistka/
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Стили, скрипты и фотографии не меняются между сборками —
# отдаём их с длительным кэшем, чтобы повторные визиты были мгновенными.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML пересобирается при каждой правке данных — кэшируем ненадолго.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
